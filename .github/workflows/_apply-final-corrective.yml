name: apply-final-corrective

on:
  push:
    branches:
      - fix/evidence-integrity-and-runtime-correctness
    paths:
      - .github/workflows/_apply-final-corrective.yml

permissions:
  contents: write

jobs:
  apply-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-integrity-and-runtime-correctness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/_final_corrective_patch.py
      - name: Syntax and diff checks
        run: |
          python -m compileall -q src tests scripts
          git diff --check
      - name: Commit patch and remove temporary automation
        run: |
          git rm scripts/_final_corrective_patch.py \
            .github/workflows/_final-corrective-fix.yml \
            .github/workflows/_apply-final-corrective.yml
          git add src schemas tests
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete fail-closed contract parity"
          git push origin HEAD:fix/evidence-integrity-and-runtime-correctness
