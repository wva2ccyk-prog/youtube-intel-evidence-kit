name: release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  build-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
    env:
      RELEASE_VERSION: "0.1.0"
      RELEASE_TAG: "v0.1.0"
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Guard release identity
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Expected version $RELEASE_VERSION, got $actual_version" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.guard.outputs.should_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        if: steps.guard.outputs.should_release == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine ".[dev]"

      - name: Verify source tree
        if: steps.guard.outputs.should_release == 'true'
        run: |
          python scripts/clean_generated_artifacts.py
          python scripts/public_release_leak_scan.py
          python scripts/check_encoding.py
          python -m pytest -W error -q -p no:cacheprovider
          python -m compileall -q src tests scripts
          python -m youtube_mcp_handoff.smoke

      - name: Build wheel and source distribution
        if: steps.guard.outputs.should_release == 'true'
        run: |
          rm -rf build dist *.egg-info src/*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Verify installed wheel
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/youtube-intel-release
          /tmp/youtube-intel-release/bin/python -m pip install --upgrade pip
          /tmp/youtube-intel-release/bin/python -m pip install dist/*.whl
          /tmp/youtube-intel-release/bin/youtube-intel doctor
          /tmp/youtube-intel-release/bin/youtube-intel topic-demo --out /tmp/topic-demo
          /tmp/youtube-intel-release/bin/youtube-intel single-video-demo --out /tmp/single-video-demo
          /tmp/youtube-intel-release/bin/youtube-intel hesitation-demo --out /tmp/hesitation-demo
          /tmp/youtube-intel-release/bin/python -m youtube_mcp_handoff.smoke

      - name: Create checksums
        if: steps.guard.outputs.should_release == 'true'
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Preserve distributions for PyPI
        if: steps.guard.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Create annotated tag
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "YouTube Intel Evidence Kit $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        if: steps.guard.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag \
            --title "$RELEASE_TAG - First public alpha" \
            --notes-file .github/release-notes/v0.1.0.md

  publish-pypi:
    needs: build-release
    if: needs.build-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/youtube-intel-evidence-kit
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Publish with repository API token
        if: env.PYPI_API_TOKEN != ''
        shell: bash
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive \
            --username __token__ \
            --password "$PYPI_API_TOKEN" \
            dist/*

      - name: Publish with PyPI Trusted Publishing
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

  verify-pypi:
    needs: publish-pypi
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install published package and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in {1..12}; do
            if python -m pip install --no-cache-dir \
              --index-url https://pypi.org/simple \
              "youtube-intel-evidence-kit==0.1.0"; then
              installed=true
              break
            fi
            sleep 10
          done
          if [[ "$installed" != "true" ]]; then
            echo "PyPI package did not become installable in the verification window" >&2
            exit 1
          fi
          youtube-intel doctor
          youtube-intel topic-demo --out /tmp/pypi-topic-demo
          youtube-intel single-video-demo --out /tmp/pypi-single-video-demo
          python -m youtube_mcp_handoff.smoke
