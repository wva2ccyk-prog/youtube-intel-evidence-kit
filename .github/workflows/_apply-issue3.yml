name: apply-issue3

on:
  push:
    branches:
      - fix/issue-3-korean-high-risk-boundaries

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-3-korean-high-risk-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_apply_issue3_patch.py
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Focused regression tests
        run: python -m pytest -W error -q -p no:cacheprovider tests/test_korean_high_risk_marker_boundaries.py
      - name: Full warning-free suite
        run: python -m pytest -W error -q -p no:cacheprovider
      - name: Commit final change and remove one-time automation
        run: |
          rm scripts/_apply_issue3_patch.py .github/workflows/_apply-issue3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Korean high-risk marker substring collisions (#3)"
          git push origin HEAD:fix/issue-3-korean-high-risk-boundaries
