name: apply-schema-parity

on:
  push:
    branches:
      - fix/evidence-integrity-and-runtime-correctness
    paths:
      - .github/workflows/_apply-schema-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-integrity-and-runtime-correctness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_schema_parity_patch.py
      - run: |
          python -m compileall -q src tests scripts
          git diff --check
      - run: |
          git rm scripts/_schema_parity_patch.py .github/workflows/_apply-schema-parity.yml
          git add schemas tests
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: close remaining schema runtime parity gaps"
          git push origin HEAD:fix/evidence-integrity-and-runtime-correctness
