name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      # The release leak scan rejects generated bytecode artifacts
      # (__pycache__/*.pyc). It must run against the checked-out source tree
      # before any step that compiles or imports the package and writes caches.
      # Editable install above can create an .egg-info / caches, so clean first.
      - name: Clean generated artifacts before release scan
        run: python scripts/clean_generated_artifacts.py
      - name: Public release leak scan (clean source tree)
        run: python scripts/public_release_leak_scan.py
      - name: Encoding check
        run: python scripts/check_encoding.py
      - name: Run tests (warning-free)
        run: python -m pytest -W error -q -p no:cacheprovider
      - name: Source-mode assertions
        run: |
          python - <<'EOF'
          from youtube_intel._fixtures import is_source_checkout
          assert is_source_checkout() is True, "CI source job must run from a source checkout"
          EOF
          python -m youtube_intel doctor | python -c "import json,sys; d=json.load(sys.stdin); assert d['core']['runtime_mode']=='source_checkout'; assert d['ok'] is True; print('doctor source_checkout OK')"
      - name: Malformed CLI smoke (structured failures)
        run: |
          python - <<'EOF'
          import json, subprocess, sys, tempfile, os
          from pathlib import Path
          def run_cli(*args):
              return subprocess.run([sys.executable, "-m", "youtube_intel", *args], capture_output=True, text=True, env={**os.environ, "PYTHONPATH":"src"})
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              # package: invalid JSON
              bad = td / "bad.json"; bad.write_text("{ not valid json", encoding="utf-8")
              r = run_cli("package", "--segments", str(bad), "--out", str(td/"o1"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              # worth: structurally invalid package
              pkg = td / "pkg.json"; pkg.write_text(json.dumps({"claim_candidates": [{}]}), encoding="utf-8")
              r = run_cli("worth", "--package", str(pkg), "--out", str(td/"o2"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              # topic-demo: null segment row, no partial artifacts
              td2 = td / "topic"; td2.mkdir()
              (td2/"video_a.json").write_text(json.dumps({"video": {"video_id": "v", "title": "T", "language": "en"}, "segments": [None]}), encoding="utf-8")
              r = run_cli("topic-demo", "--topic-dir", str(td2), "--out", str(td/"o3"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o3").exists()
              # default cue-mode fractional timestamp propagation (package CLI,
              # no --claim-assembly sentence)
              seg = td / "cue_seg.json"
              seg.write_text(json.dumps({"video": {"video_id": "rv", "title": "RV", "language": "en"},
                "segments": [{"text": "first cue", "start": 12.37, "end": 14.81, "time_ref": "00:12", "speaker": "A"},
                              {"text": "second cue.", "start": 15.05, "end": 17.10, "time_ref": "00:15", "speaker": "A"}]}), encoding="utf-8")
              r = run_cli("package", "--segments", str(seg), "--out", str(td/"o4"))
              assert r.returncode == 0, r.stderr
              pkg = json.loads((td/"o4"/"residual_package.json").read_text(encoding="utf-8"))
              c = pkg["claim_candidates"][0]
              assert abs(c["span_start"] - 12.37) < 1e-9, c
              assert abs(c["span_end"] - 14.81) < 1e-9, c
              assert abs(c["source_cue_coordinates"][0]["start"] - 12.37) < 1e-9
              assert abs(c["source_cue_coordinates"][0]["end"] - 14.81) < 1e-9
              # worth: whitespace-only required string fails closed
              ws = td / "ws_pkg.json"
              ws.write_text(json.dumps({"schema_version": "youtube_residual_v0.1",
                "video": {"video_id": "   ", "title": "T", "language": "en"},
                "claim_candidates": [{"claim_id": "C0001", "text": "A real claim text here."}]}), encoding="utf-8")
              r = run_cli("worth", "--package", str(ws), "--out", str(td/"o5"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              # topic-demo: invalid expected_groupings threshold (string)
              td3 = td / "topic2"; td3.mkdir()
              (td3/"video_a.json").write_text(json.dumps({"video": {"video_id": "v", "title": "T", "language": "en"},
                "segments": [{"text": "The kit cuts water use by twenty percent.", "speaker": "A", "time_ref": "00:00"}]}), encoding="utf-8")
              (td3/"expected_groupings.json").write_text(json.dumps({"must_link": [], "threshold": "not-a-number"}), encoding="utf-8")
              r = run_cli("topic-demo", "--topic-dir", str(td3), "--out", str(td/"o6"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o6").exists()
              # handoff: duplicate/incomplete trace row fails closed
              hp = td / "hpkg.json"
              hp.write_text(json.dumps({"schema_version": "youtube_residual_v0.1",
                "video": {"video_id": "rv", "title": "RV", "language": "en"},
                "claim_candidates": [{"claim_id": "C0001", "text": "A real claim text here.", "content_type": "claim_or_promotion", "evidence": "video_internal", "confidence": "medium", "time_ref": None}]}), encoding="utf-8")
              hw = td / "hworth.json"
              hw.write_text(json.dumps({"schema_version": "youtube_analysis_worth_v0.1",
                "video": {"video_id": "rv", "title": "RV", "language": "en"},
                "decision": {"analysis_worth": "maybe", "recommended_route": "full_verification"},
                "source_trace": [{"claim_id": "C0001", "time_ref": None, "evidence": "video_internal", "confidence": "medium", "claim_type": "claim_or_promotion", "excerpt": "x"},
                                  {"claim_id": "C0001", "time_ref": None, "evidence": "video_internal", "confidence": "medium", "claim_type": "claim_or_promotion", "excerpt": "x"}]}), encoding="utf-8")
              r = run_cli("handoff", "--package", str(hp), "--analysis-worth", str(hw), "--out", str(td/"o7"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o7"/"handoff_manifest.json").exists()
              # 1) handoff fabricated timestamp: trace invents a time_ref absent
              # from the source claim (source time_ref is None).
              hp2 = td / "hpkg2.json"
              hp2.write_text(json.dumps({"schema_version": "youtube_residual_v0.1",
                "video": {"video_id": "rv", "title": "RV", "language": "en"},
                "claim_candidates": [{"claim_id": "C0001", "text": "A real claim text here.", "content_type": "claim_or_promotion", "evidence": "video_internal", "confidence": "medium", "time_ref": None}]}), encoding="utf-8")
              hw2 = td / "hworth2.json"
              hw2.write_text(json.dumps({"schema_version": "youtube_analysis_worth_v0.1",
                "video": {"video_id": "rv", "title": "RV", "language": "en"},
                "decision": {"analysis_worth": "maybe", "recommended_route": "full_verification"},
                "source_trace": [{"claim_id": "C0001", "time_ref": "01:30", "evidence": "video_internal", "confidence": "medium", "claim_type": "claim_or_promotion", "excerpt": "x"}]}), encoding="utf-8")
              r = run_cli("handoff", "--package", str(hp2), "--analysis-worth", str(hw2), "--out", str(td/"o8"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o8").exists()
              # 2) package CLI non-string identity (integer video_id) is rejected.
              idpkg = td / "idpkg.json"
              idpkg.write_text(json.dumps({"video": {"video_id": 123, "title": "T", "language": "en"},
                "segments": [{"text": "A real claim text here.", "speaker": "A", "time_ref": "00:00"}]}), encoding="utf-8")
              r = run_cli("package", "--segments", str(idpkg), "--out", str(td/"o9"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o9").exists()
              # 3) boolean structured timestamp is rejected by the package CLI.
              nanpkg = td / "nanpkg.json"
              nanpkg.write_text(json.dumps({"video": {"video_id": "rv", "title": "RV", "language": "en"},
                "segments": [{"text": "A real claim text here.", "start": True, "speaker": "A"}]}), encoding="utf-8")
              r = run_cli("package", "--segments", str(nanpkg), "--out", str(td/"o10"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o10").exists()
              # expected_groupings missing must_link rejected at the topic-demo boundary.
              td4 = td / "topic3"; td4.mkdir()
              (td4/"video_a.json").write_text(json.dumps({"video": {"video_id": "v", "title": "T", "language": "en"},
                "segments": [{"text": "The kit cuts water use by twenty percent.", "speaker": "A", "time_ref": "00:00"}]}), encoding="utf-8")
              (td4/"expected_groupings.json").write_text(json.dumps({"threshold": 0.5}), encoding="utf-8")
              r = run_cli("topic-demo", "--topic-dir", str(td4), "--out", str(td/"o11"))
              assert r.returncode == 2 and "Traceback" not in r.stderr
              payload = json.loads(r.stdout)
              assert payload["ok"] is False and payload["error"] == "InvalidInputError"
              assert not (td/"o11").exists()
              # MCP dependency-free validator: wrong schema version rejected,
              # plus a secondary dangling evidence id rejected via the loader
              import youtube_intel.topic_collection as tc
              issues = tc.validate_topic_collection_document({"schema_version": "invalid"})
              assert issues, "expected schema-version rejection"
              # 4) MCP loader rejects matching-invalid-coordinate document.
              from youtube_intel.topic_mcp_facade import load_topic_collection
              # Build a small valid collection through topic-demo, then mutate it.
              tdok = td / "topicok"; tdok.mkdir()
              (tdok/"video_a.json").write_text(json.dumps({"video": {"video_id": "v", "title": "T", "language": "en"},
                "segments": [{"text": "The kit cuts water use by twenty percent.", "speaker": "A", "time_ref": "00:00"}]}), encoding="utf-8")
              rok = run_cli("topic-demo", "--topic-dir", str(tdok), "--out", str(td/"ook"))
              assert rok.returncode == 0, rok.stderr
              coll = json.loads((td/"ook"/"topic_collection.json").read_text(encoding="utf-8"))
              # matching-invalid coordinate: same bad timestamp in evidence and claim coord
              eid = next(iter(coll["evidence_index"]))
              coll["evidence_index"][eid]["timestamp_start"] = False
              uid = next(iter(coll["claim_index"]))
              coll["claim_index"][uid]["evidence_coordinate"]["timestamp_start"] = False
              badc = td / "badcoll.json"; badc.write_text(json.dumps(coll), encoding="utf-8")
              try:
                  load_topic_collection(badc)
                  raise AssertionError("MCP loader accepted matching-invalid coordinate")
              except Exception as exc:
                  assert "InvalidInputError" in type(exc).__name__ or isinstance(exc, ValueError), exc
              # 5) MCP loader rejects a claim in two groups (full fixture gives 2+ groups).
              from youtube_intel._fixtures import fixture_path
              from youtube_intel.topic_collection import build_topic_demo_from_segments
              m2 = build_topic_demo_from_segments(fixture_path("topic_demo"), topic_id="t", topic_title="T", output_dir=td/"mkmulti")
              coll2 = json.loads(Path(m2["paths"]["topic_collection_json"]).read_text(encoding="utf-8"))
              assert len(coll2["claim_groups"]) >= 2, "fixture expected multiple groups"
              g0 = coll2["claim_groups"][0]["claim_uids"][0]
              coll2["claim_groups"][1]["claim_uids"].append(g0)
              coll2["claim_groups"][1]["member_claim_uids"].append(g0)
              coll2["claim_groups"][1]["claim_count"] = len(coll2["claim_groups"][1]["member_claim_uids"])
              badc2 = td / "badcoll2.json"; badc2.write_text(json.dumps(coll2), encoding="utf-8")
              try:
                  load_topic_collection(badc2)
                  raise AssertionError("MCP loader accepted multi-group claim")
              except Exception as exc:
                  assert "InvalidInputError" in type(exc).__name__ or isinstance(exc, ValueError), exc
              # 6) MCP loader rejects a missing required source-video field.
              coll3 = json.loads((td/"ook"/"topic_collection.json").read_text(encoding="utf-8"))
              coll3["source_videos"][0].pop("title")
              badc3 = td / "badcoll3.json"; badc3.write_text(json.dumps(coll3), encoding="utf-8")
              try:
                  load_topic_collection(badc3)
                  raise AssertionError("MCP loader accepted missing source-video title")
              except Exception as exc:
                  assert "InvalidInputError" in type(exc).__name__ or isinstance(exc, ValueError), exc
              print("malformed CLI smoke OK (package/worth/topic-demo/handoff/MCP)")
          EOF
      - name: Compile all sources
        run: python -m compileall -q src tests scripts
      - name: MCP handoff smoke
        run: python -m youtube_mcp_handoff.smoke

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Inspect wheel for required fixtures
        run: |
          python - <<'EOF'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "youtube_intel/_fixtures/__init__.py",
              "youtube_intel/_fixtures/synthetic_segments.json",
              "youtube_intel/_fixtures/synthetic_package.json",
              "youtube_intel/_fixtures/synthetic_hesitation.json",
              "youtube_intel/_fixtures/operator_overlay.json",
              "youtube_intel/_fixtures/topic_demo/video_a.json",
              "youtube_intel/_fixtures/topic_demo/expected_groupings.json",
          ]
          missing = [r for r in required if r not in names]
          assert not missing, f"wheel missing fixtures: {missing}"
          print(f"wheel contains all {len(required)} required fixtures")
          EOF
      - name: Install wheel into a clean venv (no editable install)
        run: |
          python -m venv .wheel-venv
          . .wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
      - name: Run doctor from the installed wheel
        run: |
          . .wheel-venv/bin/activate
          youtube-intel doctor | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True; assert d['core']['runtime_mode'] == 'installed_package'; assert d['core']['synthetic_demo_available'] is True; print('doctor OK (installed_package)')"
      - name: Run topic-demo from the installed wheel
        run: |
          . .wheel-venv/bin/activate
          youtube-intel topic-demo --out /tmp/wheel-topic-demo | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True; assert d['claim_group_count'] > 0; print('topic-demo OK')"
          test -s /tmp/wheel-topic-demo/topic_collection.json
          test -s /tmp/wheel-topic-demo/topic_handoff_manifest.json
          python - <<'EOF'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/wheel-topic-demo/topic_handoff_manifest.json").read_text())
          on_disk = json.loads(Path("/tmp/wheel-topic-demo/topic_collection.json").read_text())
          assert manifest["claim_group_count"] == len(on_disk["claim_groups"])
          print("topic-demo artifacts non-empty and manifest consistent")
          EOF
      - name: Run single-video-demo from the installed wheel
        run: |
          . .wheel-venv/bin/activate
          youtube-intel single-video-demo --out /tmp/wheel-single-demo | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True; print('single-video-demo OK')"
          test -s /tmp/wheel-single-demo/handoff/handoff_manifest.json
          python - <<'EOF'
          import json
          from pathlib import Path
          on_disk = json.loads(Path("/tmp/wheel-single-demo/handoff/handoff_manifest.json").read_text())
          for key, path_text in on_disk["paths"].items():
              assert Path(path_text).is_file(), f"missing artifact {key}"
          print("single-video-demo artifacts non-empty; every manifest path exists")
          EOF
      - name: Run hesitation-demo from the installed wheel
        run: |
          . .wheel-venv/bin/activate
          youtube-intel hesitation-demo --out /tmp/wheel-hesitation-demo | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True; assert d['claim_count'] > 0; print('hesitation-demo OK')"
          test -s /tmp/wheel-hesitation-demo/hesitation_markers.json
      - name: Validate generated schemas from the installed wheel
        run: |
          . .wheel-venv/bin/activate
          # jsonschema is a dev-only checker (not a runtime dep of the wheel);
          # install it in the clean venv for this validation step only.
          python -m pip install jsonschema
          python - <<'EOF'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path("/tmp/wheel-topic-demo")
          collection = json.loads((root / "topic_collection.json").read_text())
          schema = json.loads(Path("schemas/topic_collection.schema.json").read_text())
          errors = sorted(Draft202012Validator(schema).iter_errors(collection), key=lambda e: list(e.path))
          assert not errors, "; ".join(f"{list(e.path)}: {e.message}" for e in errors[:5])
          print("generated TopicCollection validates against schema")
          EOF
      - name: Installed-wheel clean safety (must refuse everything)
        run: |
          . .wheel-venv/bin/activate
          mkdir -p /tmp/wheel-clean-target
          set +e
          youtube-intel clean /tmp/wheel-clean-target > /tmp/wheel-clean-out.json 2>/tmp/wheel-clean-err.txt
          rc=$?
          set -e
          test $rc -eq 2
          test -d /tmp/wheel-clean-target
          python - <<'EOF'
          import json
          payload = json.load(open("/tmp/wheel-clean-out.json"))
          assert payload["ok"] is False
          assert "source checkout" in payload["message"], payload
          print("installed-wheel clean refusal OK")
          EOF
